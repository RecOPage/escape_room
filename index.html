<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>층과 층 사이</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main>
<header><div><small>시설관리 기록 / EP. 01</small><h1>층과 층 사이</h1></div></header>
<div id="scroll">
<figure id="scene-art"><img src="assets/images/elevator-interior.png" alt=""><figcaption id="scene-caption">B2 · 시설관리 기록</figcaption></figure>
<aside id="notes"><h2>규칙서</h2><div id="rules-text" tabindex="0" aria-label="규칙서 원문"></div><label for="entries">추가 메모</label><textarea id="entries" aria-label="추가 메모" placeholder="발견한 단서를 적거나 붙여넣으세요." spellcheck="false"></textarea></aside>
<section><div aria-live="polite"><div id="location"></div><div id="story"></div><div id="choices"></div><div id="feedback"></div></div><div id="actions"></div></section>
</div>
<footer>
<form id="command"><input id="keyword" aria-label="조사 대상 또는 퍼즐 답" placeholder="조사할 대상 또는 답" autocomplete="off"><button id="submit">입력</button><button type="button" id="use" hidden>여기에 놓아 사용</button></form>
<div id="pocket-wrap"><small>주머니</small><div id="pocket"><div class="slot"><button id="ticket" type="button" aria-label="회수권 선택" hidden><img class="ticket-art" src="assets/images/elevator-ticket.png" alt="" draggable="false">회수권</button></div><div class="slot"><button id="damaged" type="button" aria-label="깨진 회수권 선택" hidden><img class="ticket-art" src="assets/images/elevator-ticket.png" alt="" draggable="false">회�권</button></div><div class="slot"><button id="grant" type="button" aria-label="지급권 선택" hidden><img class="ticket-art" src="assets/images/elevator-ticket.png" alt="" draggable="false">지급권</button></div><div class="slot"><span id="shoes" hidden>구두</span></div></div></div>
</footer>
</main>
<script src="assets/game.js"></script>
</body>
</html>
